<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panda Commerce</title>

    <!-- favicon -->
    <link rel="shortcut icon" href="./images/fav.png" type="image/favicon" />

    <!-- font awesome CDN⬇️ -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind and Daisy UI CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- stylesheet -->
    <link rel="stylesheet" href="./style.css" />
  </head>
  <!-- Body Start -->
  <body class="inter-font">
    <header class="md:w-10/12 w-11/12 mx-auto mt-5">
      <nav class="flex justify-between items-center md:bg-gray-100 md:px-6 py-2 rounded-xl">
        <div>
          <img class="w-28 md:w-32" src="images/logo.png" alt="brand-logo" />
        </div>
        <div>
          <div class="w-44 md:w-80">
            <fieldset class="fieldset">
              <input
                type="text"
                class="input rounded-full"
                placeholder="Search"
              />
            </fieldset>
          </div>
        </div>

        <div class="md:space-x-6 hidden md:flex">
          <a href="./index.html">Home</a>
          <a href="./index.html">Product</a>
          <a href="./index.html">About Us</a>
          <a href="./index.html">Contact Us</a>
        </div>

        <div class="md:hidden">
          <!-- change popover-1 and --anchor-1 names. Use unique names for each dropdown -->
          <button
            class="btn  "
            popovertarget="popover-1"
            style="anchor-name: --anchor-1"
          >
            <i class="fa-solid fa-bars "></i>
          </button>
          <ul
            class="dropdown dropdown-end menu w-52 rounded-box bg-base-100 shadow-sm"
            popover
            id="popover-1"
            style="position-anchor: --anchor-1"
          >
            <li><a href="./index.html">Home</a></li>
            <li><a href="./index.html">Product</a></li>
            <li><a href="./index.html">About Us</a></li>
            <li><a href="./index.html">Contact Us</a></li>
          </ul>
        </div>
      </nav>
    </header>
  </body>
</html>
